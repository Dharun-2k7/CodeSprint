version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codesprint_db
    environment:
      POSTGRES_USER: codesprint
      POSTGRES_PASSWORD: codesprint123
      POSTGRES_DB: codesprint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesprint"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codesprint_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=codesprint
      - DB_PASSWORD=codesprint123
      - DB_NAME=codesprint
      - JWT_SECRET=your-secret-key-change-in-production
      - JUDGE0_URL=https://judge0-ce.p.rapidapi.com
      - RAPIDAPI_KEY=your_rapidapi_key_here
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

